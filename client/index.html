<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1677E8" />
    <meta name="description" content="Connect Tutors — a simple tutor matching platform for students and guardians in Bangladesh." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Connect Tutors" />
    <title>Connect Tutors | Build your learning connection</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // An Admin page carries the Admin app's manifest, Home Screen icon and name, so the browser offers
      // that app and not the site's. Before the app starts, so the browser never reads the wrong one;
      // client/src/lib/appManifest.ts keeps it right as the visitor moves about without reloading.
      (function () {
        var path = location.pathname;
        if (path !== "/admin" && path.indexOf("/admin/") !== 0) return;
        var manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute("href", "/admin.webmanifest");
        var icon = document.querySelector('link[rel="apple-touch-icon"]');
        if (icon) icon.setAttribute("href", "/admin-apple-touch-icon-180x180.png");
        var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (title) title.setAttribute("content", "CT Admin");
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
